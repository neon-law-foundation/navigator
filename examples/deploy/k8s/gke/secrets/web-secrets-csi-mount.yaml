# Mount the Secret Manager CSI volume on the `web` container.
#
# This patch is the second half of the CSI secret-sync (the first is
# secret-provider-class.yaml). The two are one unit: the class alone
# projects nothing, because the driver reconciles the Secret only while a
# pod mounts the volume. Add or remove them from `../kustomization.yaml`
# together.
#
# WHY A MOUNT IS REQUIRED EVEN THOUGH WE WANT envFrom
# ---------------------------------------------------
# The GKE driver only writes the `secretObjects` K8s Secret while at
# least one pod mounts the volume — the sync is volume-lifecycle
# driven, not a standalone controller. So `web` mounts the volume at
# `/var/secrets` (the files are a side effect we don't read) purely so
# the driver keeps the projected Secret reconciled; `web` and
# `workflows-service` still consume the values via their existing
# `envFrom: secretRef:` on that deployment's own Secret name, which
# `ops ship` substitutes from `NAVIGATOR_WEB_SECRET_NAME`. Pod picks up a rotated
# value on its next restart (add a reloader annotation later for
# restart-free rotation).
#
# `kubectl get csidrivers` on the live cluster shows
# `secrets-store-gke.csi.k8s.io`, which is what the `driver:` field
# below names. Re-check it at activation time; if the add-on ever
# re-registers under another name, change the field to match.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navigator-web
  namespace: navigator
spec:
  template:
    spec:
      containers:
        - name: web
          volumeMounts:
            - name: web-secrets-store
              mountPath: /var/secrets
              readOnly: true
      volumes:
        - name: web-secrets-store
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: navigator-web
