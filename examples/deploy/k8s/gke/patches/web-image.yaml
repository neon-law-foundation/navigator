# Pin the prod web image to a specific published release. The daily
# tag flow in `.github/workflows/deploy.yml` builds `main` HEAD and
# publishes to
# `YOUR_IMAGE_REGISTRY/NAVIGATOR_WEB_IMAGE:YY.M.D`
# (the release date) + `latest`. Pin the dated `YY.M.D` tag here — never
# `:latest` on a workload — and `navigator ops ship` (or a hand-bump
# that Config Sync rolls forward on the next 15s tick) moves it. A fork
# swaps `YOUR_PROJECT_ID` (and region) for its own Artifact Registry; the
# GKE nodes authenticate to the private registry via Workload Identity, so
# no imagePullSecret is needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navigator-web
  namespace: navigator
spec:
  template:
    spec:
      containers:
        - name: web
          image: YOUR_IMAGE_REGISTRY/NAVIGATOR_WEB_IMAGE:YY.M.D
          imagePullPolicy: IfNotPresent
