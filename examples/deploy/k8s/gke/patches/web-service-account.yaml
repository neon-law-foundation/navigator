# Bind the `web` pod to the navigator-web KSA so the container's GCS and
# Secret Manager access runs under Workload Identity as
# `NAVIGATOR_GCP_SERVICE_ACCOUNT_ID@YOUR_PROJECT_ID.iam.gserviceaccount.com`
# (see `iam.yaml`).
#
# This is REQUIRED, not optional: without it the pod falls back to the
# `default` KSA, whose GSA holds none of the object-storage or secret
# permissions `web` needs, and every document read and every mounted secret
# fails at runtime. Navigator deploys exactly one instance per GCP project,
# so the KSA name is fixed, not templatized. The base
# (`k8s/base/web/web.yaml`) deliberately omits it because KIND has no such
# KSA; the GKE overlay owns it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navigator-web
  namespace: navigator
spec:
  template:
    spec:
      serviceAccountName: navigator-web
