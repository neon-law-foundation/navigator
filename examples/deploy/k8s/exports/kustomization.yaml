apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: navigator

# Scheduled triggers. The `Archives` (nightly) workflow is hosted by the
# `workflows-service` worker (see ../gke/workflows-service/) — these
# CronJobs are thin triggers that POST to the Restate Cloud ingress to
# start one invocation, then exit.
resources:
  - cron-archives-trigger.yaml
  - cron-surreal-archive.yaml
  - surreal-archive-monitoring.yaml
  - cron-heartbeat-trigger.yaml
  - cron-github-automation-heartbeat-trigger.yaml
  - cron-billing-digest-trigger.yaml
