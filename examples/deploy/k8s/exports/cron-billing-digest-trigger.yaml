# billing-digest daily trigger — starts one `BillingDigest` Restate workflow
# invocation per day. The workflow itself is hosted by the `workflows-service`
# worker (../gke/workflows-service/) — all workflows live there, so there is no
# separate digest worker. This CronJob is a thin trigger that POSTs to the
# Restate Cloud ingress and exits in seconds. Restate owns the retry schedule.
#
# `BillingDigest` posts firm ops a trailing-window GCP cost report covering every
# configured billing account and every project on each — a cross-account
# roll-up, then per account a table by project and one by service, each against
# the prior window. The BigQuery billing export is written per billing account,
# so BILLING_EXPORT_TABLE is a comma-separated list with one table per account;
# the message names every account it read. The worker needs BILLING_EXPORT_TABLE
# + BIGQUERY_PROJECT set (env on the workflows-service Deployment), and
# roles/bigquery.dataViewer on *each* account's billing dataset; unset → the
# workflow is a clean no-op.
#
# Schedule `0 13 * * *` UTC = 05:00 PST (06:00 PDT). 13:00 clears the billing
# export's ~24h lag and avoids every other cron (archives 10:00, reconcile
# 11:00, heartbeat */6h, canary 14:00 Sun). The trigger
# keys each invocation on the UTC date, so a same-day double-fire is a no-op.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: billing-digest-trigger
  namespace: navigator
  labels:
    app: billing-digest-trigger
spec:
  schedule: "0 13 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  # Forbid + a finite deadline together: never overlap runs, but never let a
  # stuck trigger (e.g. ImagePullBackOff, or a hung ingress POST) stay Active
  # and skip every subsequent schedule. A healthy trigger exits in seconds.
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: billing-digest-trigger
        spec:
          restartPolicy: OnFailure
          containers:
            - name: billing-digest-trigger
              image: YOUR_IMAGE_REGISTRY/navigator-billing-digest-trigger:YY.M.D
              imagePullPolicy: Always
              env:
                # Restate Cloud ingress endpoint. Sourced from the Secret rather
                # than written inline — see the `RESTATE_INGRESS_URL` note in
                # kustomization.yaml for why a literal here blocks every manifest
                # change. The trigger POSTs
                # `${RESTATE_INGRESS_URL}/BillingDigest/<run-date>/run`.
                - name: RESTATE_INGRESS_URL
                  valueFrom:
                    secretKeyRef:
                      name: navigator-web-secrets
                      key: RESTATE_INGRESS_URL
                      optional: true
                # Restate Cloud authenticates every ingress call with the
                # tenant bearer. Sourced from the same `navigator-web-secrets`
                # Secret the web Deployment mounts. `optional` so KIND — where
                # this manifest isn't applied — never blocks on a missing key.
                - name: RESTATE_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: navigator-web-secrets
                      key: RESTATE_AUTH_TOKEN
                      optional: true
                - name: RUST_LOG
                  value: info
              envFrom:
                # Collector endpoint (OTEL_EXPORTER_OTLP_ENDPOINT) — the trigger
                # emits the `navigator.workflow.trigger.fired` metric (flushed on
                # exit) through the fail-closed redaction collector. Shared with
                # web + workflows-service via one ConfigMap.
                - configMapRef:
                    name: navigator-otel-env
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  memory: 128Mi
