# Role assignments for seeded persons. See `docs/access-model.md` for the model.
#
# Convention enforced by `store::seed::require_firm_domain`:
# - The primary administrator is `nick@neonlaw.com` (lowercase, exact).
#   Mixed-case seeds are rejected at load time.
# - `owner`, `admin`, and `clerk` seeds use a lowercase `@neonlaw.com` email. `lawyer`
#   means a person licensed to practice law and authorized for Navigator legal work, so an outside
#   lawyer may use their own domain and remains Project-participation scoped.
# - `client` is the default for new persons (set in code on insert);
#   no entry is needed here for clients.
lookup_fields:
  - person_id
records:
  - person:
      email: nick@neonlaw.com
    role: admin
