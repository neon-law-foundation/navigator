# KIND-only Rauthy credentials and client registration. The known passwords and
# localhost wildcard redirects are safe only because KIND binds the NodePort to
# the developer machine; no reusable staging credential lives in this fixture's
# parent layer.
apiVersion: v1
kind: Secret
metadata:
  name: rauthy-secrets
  namespace: navigator
type: Opaque
stringData:
  HQL_SECRET_RAFT: ECmmHCFwIXzxwPpxbGSPNJztwtlCbcZfGRDFWfVGqqrHDnTc
  HQL_SECRET_API: cPEyggSrcRFCRJhvYsWLircnULuZdGLbwnVVvDUTUwmVlYzT
