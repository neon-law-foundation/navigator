# KIND-only Rauthy credentials and client registration. The known passwords and
# localhost wildcard redirects are safe only because KIND binds the NodePort to
# the developer machine; no reusable staging credential lives in this fixture's
# parent layer.
apiVersion: v1
kind: Secret
metadata:
  name: rauthy-secrets
  namespace: navigator
type: Opaque
stringData:
  HQL_SECRET_RAFT: ECmmHCFwIXzxwPpxbGSPNJztwtlCbcZfGRDFWfVGqqrHDnTc
  HQL_SECRET_API: cPEyggSrcRFCRJhvYsWLircnULuZdGLbwnVVvDUTUwmVlYzT
  ENC_KEYS: navdev/3QWXNRYth48aapMLiYBCOzICs2m/H1dzwfPu6pwykhw=
  ENC_KEY_ACTIVE: navdev
  PUB_URL: localhost:30080
  RP_ORIGIN: http://localhost:30080
  OAUTH_ISSUER_URL: http://localhost:30080/auth/v1/
  BOOTSTRAP_ADMIN_EMAIL: nick@neonlaw.com
  BOOTSTRAP_ADMIN_PASSWORD_PLAIN: admin
---
apiVersion: v1
kind: Secret
metadata:
  name: rauthy-client
  namespace: navigator
type: Opaque
stringData:
  OAUTH_CLIENT_SECRET: navigatorwebsecretnavigatorwebsecretnavigatorwebsecretnavigatorw
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rauthy-bootstrap
  namespace: navigator
data:
  config.toml: |
    [access]
    rfc_8252_enable = true

    [bootstrap]
    bootstrap_dir = '/app/bootstrap'

    [cluster]
    node_id = 1
    nodes = ['1 localhost:8100 localhost:8200']
    cache_storage_disk = false

    [database]

    [dev]
    insecure_cookie = true

    [mfa]
    admin_force_mfa = false

    [server]
    scheme = 'http'
    pub_url = 'localhost:30080'

    [user_registration]
    enable = false

    [webauthn]
    rp_id = 'localhost'
    rp_origin = 'http://localhost:30080'
    rp_name = 'Neon Law Navigator'
  users.json: |
    [
      {
        "email": "owner@neonlaw.com",
        "preferred_username": "owner",
        "given_name": "Olive",
        "family_name": "Owner",
        "password": { "Plain": "password" },
        "roles": ["user"],
        "enabled": true,
        "email_verified": true
      },
      {
        "email": "admin@neonlaw.com",
        "preferred_username": "admin",
        "given_name": "Ada",
        "family_name": "Admin",
        "password": { "Plain": "password" },
        "roles": ["user"],
        "enabled": true,
        "email_verified": true
      },
      {
        "email": "lawyer@neonlaw.com",
        "preferred_username": "lawyer",
        "given_name": "Lawrence",
        "family_name": "Lawyer",
        "password": { "Plain": "password" },
        "roles": ["user"],
        "enabled": true,
        "email_verified": true
      },
      {
        "email": "clerk@neonlaw.com",
        "preferred_username": "clerk",
        "given_name": "Clara",
        "family_name": "Clerk",
        "password": { "Plain": "password" },
        "roles": ["user"],
        "enabled": true,
        "email_verified": true
      },
      {
        "email": "client@neonlaw.com",
        "preferred_username": "client",
        "given_name": "Cleo",
        "family_name": "Client",
        "password": { "Plain": "password" },
        "roles": ["user"],
        "enabled": true,
        "email_verified": true
      }
    ]
  clients.json: |
    [
      {
        "id": "navigator-web",
        "name": "Neon Law Navigator",
        "secret": {
          "Plain": "navigatorwebsecretnavigatorwebsecretnavigatorwebsecretnavigatorw"
        },
        "redirect_uris": ["http://localhost:*"],
        "post_logout_redirect_uris": ["http://localhost:*"],
        "enabled": true,
        "flows_enabled": ["authorization_code", "refresh_token"],
        "access_token_alg": "RS256",
        "id_token_alg": "RS256",
        "auth_code_lifetime": 60,
        "access_token_lifetime": 3600,
        "scopes": ["openid", "profile", "email"],
        "default_scopes": ["openid", "profile", "email"],
        "challenges": ["S256"],
        "force_mfa": false
      }
    ]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rauthy-loopback-proxy
  namespace: navigator
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;

    events {
      worker_connections 128;
    }

    http {
      access_log /dev/stdout combined;
      server {
        listen 127.0.0.1:30080;
        location / {
          proxy_http_version 1.1;
          proxy_set_header Host localhost:30080;
          proxy_pass http://rauthy:8080;
        }
      }
    }
