apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The full local KIND stack in private mode — `../kind` exactly, plus
# the Pingora network-and-basic-auth gateway in front of `web`.
#
# `navigator dev up` / `dev deploy` apply this overlay instead of
# `../kind` when `NAVIGATOR_PRIVATE_MODE` is affirmative; nothing else
# selects it, and `NAVIGATOR_KIND_OVERLAY` still overrides both. Keeping
# it as its own overlay (rather than a flag `kubectl kustomize` does not
# have) is what lets `dev kustomize kind` render exactly what would be
# applied.
#
# Local sign-in through this overlay is `go` / `bears` at the browser's
# basic-auth prompt first, then the usual Rauthy login. The browser
# e2e gate (`dev browser-e2e`) does not send the header, so leave
# `NAVIGATOR_PRIVATE_MODE` unset for a verification run.

namespace: navigator

resources:
  - ../kind

components:
  - ../../components/private-mode
