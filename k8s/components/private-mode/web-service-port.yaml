# Point `Service/navigator-web` at the Pingora gateway sidecar instead of the app.
#
# This one field is what actually turns private mode on: the Service's
# published port is unchanged (80), so neither the KIND Ingress nor the
# GKE load balancer backend needs editing, but the traffic it forwards
# now lands on Pingora (8080), which checks the client network and challenges
# for basic auth before
# proxying to `web` on loopback 3001.
#
# Deliberately NOT retargeted, and worth knowing before enabling this in
# production:
#   - `Service/navigator-web-mcp` (examples/deploy/k8s/gke/iap/) selects
#     the same pods on 3001 for `/mcp`. It stays direct because it is
#     already gated by IAP, which is a stronger door than this one.
#   - Machine callers that reach `web` through the public host — SendGrid
#     inbound parse, GitHub webhooks, DocuSign Connect — will receive 401
#     while private mode is on. That is the intended posture for a
#     deployment that is not public yet; a deployment that needs both
#     wants the Tailscale path in `kustomization.yaml`, not a per-path
#     `auth_basic off` carve-out for anything a stranger can POST to.
apiVersion: v1
kind: Service
metadata:
  name: navigator-web
  namespace: navigator
spec:
  ports:
    - port: 80
      targetPort: 8080
