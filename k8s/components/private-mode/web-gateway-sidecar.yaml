apiVersion: apps/v1
kind: Deployment
metadata:
  name: navigator-web
  namespace: navigator
spec:
  template:
    spec:
      containers:
        - name: private-gateway
          image: navigator-gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: private-http
              containerPort: 8080
          env:
            - name: GATEWAY_LISTEN
              value: 0.0.0.0:8080
            - name: GATEWAY_UPSTREAM
              value: 127.0.0.1:3001
            - name: GATEWAY_ALLOWED_NETS
              valueFrom:
                configMapKeyRef:
                  name: navigator-private-gateway
                  key: allowed-nets
            - name: GATEWAY_TRUST_XFF
              valueFrom:
                configMapKeyRef:
                  name: navigator-private-gateway
                  key: trust-forwarded-for
            - name: GATEWAY_BASIC_AUTH
              valueFrom:
                secretKeyRef:
                  name: navigator-private-basic-auth
                  key: basic-auth
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
