apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Private mode inserts Navigator's Pingora gateway in front of `web`.
# `NAVIGATOR_PRIVATE_MODE` selects this component through the KIND overlay
# and `navigator ops ship` appends it to the rendered GKE kustomization.
# The Service stays the one front door in both topologies; it changes only
# from web's port 3001 to the gateway's port 8080.
#
# `/health` is deliberately open for Kubernetes and load-balancer probes.
# Every other request is ordered: client network (403) then basic credential
# (401) then web. An empty or missing allowlist fails closed. This remains a
# staged-access gate, not application authorization: OIDC and `persons.role`
# decide who may use Navigator. Tailscale device identity remains the #1116
# follow-up; do not treat this shared credential as the final boundary.

resources:
  - gateway.yaml

patches:
  - path: web-gateway-sidecar.yaml
    target:
      kind: Deployment
      name: navigator-web
  - path: web-service-port.yaml
    target:
      kind: Service
      name: navigator-web
