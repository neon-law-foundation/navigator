apiVersion: v1
kind: ConfigMap
metadata:
  name: navigator-private-gateway
  namespace: navigator
data:
  # Explicitly broad until #1116 supplies tailnet egress ranges. A missing or
  # empty value is rejected by the gateway rather than silently allowing all.
  allowed-nets: "0.0.0.0/0,::/0"
  # The KIND ingress and GKE load balancer report the client address here.
  trust-forwarded-for: "true"
---
# The committed value is a staged-access credential, not a secret. Operators
# replace it outside the repository when a deployment needs a distinct value.
apiVersion: v1
kind: Secret
metadata:
  name: navigator-private-basic-auth
  namespace: navigator
type: Opaque
stringData:
  basic-auth: go:bears
