# THROWAWAY reproduction lane for ENG-312. Not a merge gate; delete before
# this branch merges, or replace it with the bounded lane the issue asks for.
#
# Why it exists: `store::firm_anchor_race::concurrent_creates_land_exactly_one_anchor`
# forked on the merge gate (run 32572753062 attempt 1, `left: 2`) and does not
# reproduce off this runner class. Measured negatives, so nobody repeats them:
#
#   * arm64 Linux, plain build, 4 pinned saturated cores, 20 runs   -> 0/160 races
#   * arm64 Linux, -C instrument-coverage, 4 concurrent x 20 iters  -> 0/640 races
#   * arm64 Linux, raw claim CREATE probe, 4 concurrent x 10 iters  -> 0/3200 races
#   * macOS 18-core, raw claim CREATE probe, 40 rounds              -> passed
#   * x86_64 emulated, instrumented, 4 concurrent x 10 iters        -> 0/320 races
#   * THIS runner class, instrumented, 4 concurrent x 60 iters      -> 0/1920 races
#                                                (run 32577720374)
#
# So neither architecture nor CPU saturation is the trigger. The remaining
# unmatched condition is the load: the fork happened to test #4486 of 5450,
# four concurrent nextest processes deep into the run. This lane therefore uses
# the real workspace suite as its load generator and races the binary
# underneath it.
name: firm-anchor-race-repro

on:
  # `workflow_dispatch` alone is unreachable here: GitHub only offers it for
  # workflows already on the default branch, and this file deliberately never
  # lands there. The push trigger is what actually runs it.
  push:
    branches:
      - claude/firm-anchor-race-eng-312-b9d482
  workflow_dispatch:
    inputs:
      iterations:
        description: how many iterations, each running 4 concurrent copies
        default: "60"
      concurrency:
        description: concurrent copies of the race binary per iteration
        default: "4"

jobs:
  repro:
    # The class the fork was observed on, not a nearby one. `left: 2` is
    # scheduler-dependent, so the runner is part of the reproduction.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # The gate's own flags, so the binary under test is built the way the
      # binary that failed was built.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C strip=symbols"
    steps:
      - name: install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cache the Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: loop the race until it forks
        run: |
          set -uo pipefail
          echo "nproc: $(nproc)"
          echo "arch : $(uname -m)"
          # Same instrumentation the failing job ran under: coverage counters
          # slow every branch inside the transaction window, which is the one
          # difference between the gate and a plain `cargo test`.
          eval "$(cargo llvm-cov show-env --export-prefix)"
          cargo llvm-cov clean --profraw-only

          BIN=$(cargo test -p store --test firm_anchor_race --no-run --locked \
                  --message-format=json 2>/dev/null \
                | jq -r 'select(.executable != null and .target.name == "firm_anchor_race") | .executable' \
                | tail -1)
          echo "binary: $BIN"
          test -n "$BIN"

          CONC="${{ inputs.concurrency || '4' }}"

          # `yes` loops were not enough: 60 iterations x 4 copies on this exact
          # runner class came back 0/1920 (run 32577720374). CPU saturation is
          # not the load that produced the fork.
          #
          # The failing test was #4486 of 5450, four concurrent nextest
          # processes deep into a 274-second run. That load is memory pressure
          # and scheduler diversity from ~240 statically-linked test binaries,
          # which a spin loop cannot synthesize. So run the REAL suite as the
          # load generator and race the binary underneath it for as long as it
          # lasts.
          cargo nextest run --workspace --no-run
          cargo nextest run --workspace --test-threads=4 --no-fail-fast \
            > /tmp/suite.log 2>&1 &
          SUITE=$!

          fail=0
          iter=0
          while kill -0 "$SUITE" 2>/dev/null; do
            iter=$((iter + 1))
            pids=""; rc=0
            for j in $(seq 1 "$CONC"); do
              "$BIN" --exact concurrent_creates_land_exactly_one_anchor \
                --test-threads=1 > "/tmp/out.$j" 2>&1 &
              pids="$pids $!"
            done
            for p in $pids; do wait "$p" || rc=1; done
            if [ "$rc" -ne 0 ]; then
              fail=$((fail + 1))
              echo "::error::iteration $iter forked the anchor"
              grep -h -A4 "panicked at" /tmp/out.* | head -20
            fi
          done
          wait "$SUITE" || true

          # The suite ran the test once itself, exactly as the gate did. That
          # instance is the closest thing to the original failure, so report it
          # whether or not the loop underneath reproduced.
          echo "--- the suite's own run of the race ---"
          grep -E "firm_anchor_race|left:|right:" /tmp/suite.log | head -20 || true
          if grep -q "FAIL.*firm_anchor_race" /tmp/suite.log; then
            echo "::error::the suite's own instance forked"
            fail=$((fail + 1))
          fi

          echo "=== $fail of $iter iterations forked (x$CONC concurrent copies, under full-suite load) ==="
          ITERS="$iter"
          # Reproducing IS the success condition for this lane, so a fork exits
          # zero and a clean sweep is what fails: a green run here means the
          # reproduction was not bought, which is the thing worth knowing.
          if [ "$fail" -eq 0 ]; then
            echo "::error::not reproduced in $ITERS iterations"
            exit 1
          fi
